<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de Viandas</title>
<meta name="theme-color" content="#F3EEE5">
<!-- El tema se aplica antes de pintar para que no haya parpadeo: la elección guardada o la del sistema. -->
<script>try{var t=localStorage.getItem('viandas.tema');
document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
catch(e){document.documentElement.dataset.theme='light';}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@500;600&display=swap">
<!-- Cuando se publique un cambio, subir el número de ?v= para que los navegadores bajen los archivos nuevos. -->
<link rel="stylesheet" href="css/app.css?v=23">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="boot" class="boot" role="status"><div>
  <div class="ld-orbit" role="img" aria-label="Cargando"><i class="o1"><b></b><b></b><b></b><b></b><b></b></i><i class="o2"><b></b><b></b><b></b><b></b><b></b></i><i class="o3"><b></b><b></b><b></b><b></b><b></b></i><s></s></div>
  <span class="boot-txt">Cargando…</span></div></div>

<div id="login-screen" class="loginwrap hidden">
  <div class="login">
    <div class="brand"><span class="mark">V</span><span id="login-brand">Gestión de Viandas</span><span class="env-local" id="env-login" hidden>Base local</span></div>
    <div class="logincard">
      <h1>Ingresar</h1>
      <p class="sub">Con el usuario que te dieron para el negocio.</p>
      <div id="login-error" class="loginerr hidden" role="alert"></div>
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button class="btn primary" type="submit" id="login-submit">Ingresar</button>
      </form>
    </div>
  </div>
</div>

<div id="app-screen" class="app hidden">
  <header class="topnav" id="topnav" aria-label="Menú principal"></header>
  <main class="main">
    <header class="bar" id="bar"></header>
    <div class="view" id="main"></div>
  </main>
</div>

<div id="overlay-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>

<!-- en la compu (127.0.0.1 / localhost) se usa la base local si existe js/config.local.js; en Netlify, siempre producción -->
<script>if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.write('<script src="js/config.local.js?' + Date.now() + '"><\/script>');</script>
<script src="js/config.js?v=23"></script>
<script src="js/util.js?v=23"></script>
<script src="js/data.js?v=23"></script>
<script src="js/vistas/hoy.js?v=23"></script>
<script src="js/vistas/entregas.js?v=23"></script>
<script src="js/vistas/comandas.js?v=23"></script>
<script src="js/vistas/menudia.js?v=23"></script>
<script src="js/vistas/rutas.js?v=23"></script>
<script src="js/vistas/clientes.js?v=23"></script>
<script src="js/vistas/renovar.js?v=23"></script>
<script src="js/vistas/stock.js?v=23"></script>
<script src="js/vistas/estadisticas.js?v=23"></script>
<script src="js/vistas/registro.js?v=23"></script>
<script src="js/vistas/equipo.js?v=23"></script>
<script src="js/app.js?v=23"></script>
</body>
</html>
